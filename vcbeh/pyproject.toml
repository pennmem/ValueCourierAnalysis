[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vcbeh"
version = "0.1.0"
description = "Value-directed free recall behavioral analysis (Python port of the MATLAB vcbeh pipeline)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter>=1.0", "nbformat>=5.0", "nbconvert>=7.0"]

[project.scripts]
vcbeh = "vcbeh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
